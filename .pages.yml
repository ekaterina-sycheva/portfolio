media:
  input: public/images
  output: /images
content:
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: json
    filename: '{primary}.json'
    fields:
      - { name: slug, label: URL slug, type: string, required: true }
      - { name: title, label: Project title, type: string, required: true }
      - { name: discipline, label: Discipline, type: select, options: { values: [Graphic Design, Brand Identity, Poster Design] } }
      - { name: year, label: Year, type: string }
      - { name: description, label: Description, type: text, required: true }
      - { name: additionalDescription, label: Additional description, type: text }
      - { name: cover, label: Cover image, type: image }
      - name: gallery
        label: Gallery images
        type: object
        list: true
        fields:
          - { name: image, label: Image, type: image, required: true }
          - { name: alt, label: Alternative text, type: string, required: true }
          - { name: caption, label: Caption, type: string }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Display order, type: number, default: 100 }
      - { name: seoDescription, label: SEO description, type: text }
  - name: press
    label: Press
    type: collection
    path: src/content/press
    format: json
    filename: '{primary}.json'
    fields:
      - { name: title, label: English title, type: string, required: true }
      - { name: publication, label: Publication, type: string, required: true }
      - { name: year, label: Year, type: number }
      - { name: description, label: Individual English description, type: text, required: true }
      - { name: url, label: Original article URL, type: string, required: true }
      - { name: published, label: Published, type: boolean, default: false }
      - { name: order, label: Order, type: number }
  - name: recognition
    label: Awards & Exhibitions
    type: collection
    path: src/content/recognition
    format: json
    filename: '{primary}.json'
    fields:
      - { name: title, label: Name, type: string, required: true }
      - { name: year, label: Year, type: number, required: true }
      - { name: order, label: Order within year, type: number, default: 100, description: 'Lower numbers appear first within the same year.' }
      - { name: category, label: Type, type: select, options: { values: [Award, Exhibition] } }
      - { name: description, label: Description, type: text }
      - { name: url, label: Organizer or evidence URL, type: string }
      - { name: published, label: Published, type: boolean, default: false }
  - name: about
    label: About
    type: file
    path: src/content/pages/about.json
    format: json
    fields:
      - { name: bio, label: Biography, type: text, required: true }
      - { name: seoDescription, label: SEO description, type: text }
  - name: site-settings
    label: Site Settings
    type: file
    path: src/content/pages/site-settings.json
    format: json
    fields:
      - { name: backgroundColor, label: Background color (hex), type: string, required: true, description: 'Example: #f5f5f1' }
      - { name: textColor, label: Text color (hex), type: string, required: true, description: 'Example: #151515' }
      - { name: mutedColor, label: Secondary text color (hex), type: string, required: true, description: 'Example: #777777' }
      - { name: borderColor, label: Border color (hex), type: string, required: true, description: 'Example: #d8d8d3' }
      - { name: gridGap, label: Project grid gap (px), type: number, required: true, default: 8, description: 'Recommended 0–40' }
      - { name: headerBackgroundColor, label: Header background color (hex), type: string, required: true, default: '#f5f5f1' }
      - { name: headerTextColor, label: Header text color (hex), type: string, required: true, default: '#151515' }
      - { name: brandFontSize, label: Brand font size (px), type: number, required: true, default: 18 }
      - { name: subtitleFontSize, label: Subtitle font size (px), type: number, required: true, default: 10 }
      - { name: navigationFontSize, label: Navigation font size (px), type: number, required: true, default: 11 }
